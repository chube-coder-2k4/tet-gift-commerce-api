  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commerce-app
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xmx512m -Xms256m
    ports:
      - "8085:8085"
    networks:
      - commerce-network
    env_file:
      - .env

