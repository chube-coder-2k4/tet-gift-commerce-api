spring:
  config:
    activate:
      on-profile: prod
  application:
    name: commerce-gateway-production
  datasource:
    url: jdbc:postgresql://localhost:55432/tetshopping
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis.railway.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: true
    default-encoding: UTF-8
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "https://api.shophuypro.store/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email,read:email
            authorization-grant-type: authorization_code
            redirect-uri: "https://api.shophuypro.store/login/oauth2/code/github"
        provider:
          google:
            issuer-uri: https://accounts.google.com
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        transport: rest
        chat:
          options:
            model: gemini-1.5-flash
            temperature: 0.7
    transformers:
      embedding:
        onnx:
          modelUri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json

mail:
  from: ${MAIL_FROM}

app:
  frontend-url: https://shophuypro.store
  cookie-secure: true

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_SECRET_KEY}
  url: ${VNPAY_PAY_URL}
  api-url: ${VNPAY_API_URL}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}

jwt:
  timeout: ${JWT_TIME_OUT}
  secretKey: ${JWT_SECRET}
  expiryDay: ${REFRESH_TOKEN_EXPIRATION_DAYS}
  refreshKey: ${JWT_REFRESH_SECRET}
  resetKey: ${JWT_RESET_PASSWORD_SECRET}

logging:
  level:
    root: INFO
    com.tetgift: DEBUG

chatbot:
  enabled: ${CHATBOT_ENABLED:true}
  fallback-message: "Xin lỗi, hệ thống AI đang bận. Vui lòng thử lại sau hoặc liên hệ hotline 1900-1234."
